[project]
name = "backend"
version = "0.1.0"
description = "Propilot AI — agent runtime and HTTP API"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Farid Yani", email = "realtorfarid@gmail.com" }]

dependencies = [
    "fastapi>=0.128.8",
    "uvicorn[standard]>=0.39.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pydantic-ai>=0.8.1",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "langfuse>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
propilot = "backend.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

# --------------------------------------------------------------------------
# Tooling
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from the source tree directly, so the suite does not
# depend on an editable install being present or healthy.
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:backend.*"]

[tool.coverage.run]
source = ["src/backend"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langfuse.*"]
ignore_missing_imports = true
