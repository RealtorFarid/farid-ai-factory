name: CI

on:
  push:
    # Every branch, so a feature branch is verified before a PR exists.
    branches: ["**"]
  pull_request:
    # Same-repo PRs are already covered by `push`; this catches forks. The
    # per-job `if` below drops the duplicate run for same-repo branches.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  backend:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a .env file was committed
        working-directory: .
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is tracked in git. Remove it and rotate the credentials."
            exit 1
          fi
          echo "No .env files tracked."

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Verify the lockfile is up to date
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore

  web:
    name: Typecheck, lint and build the web app
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

  docker:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: propilot-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        run: |
          docker run -d --name propilot -p 8000:8000 propilot-backend:ci
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then break; fi
            sleep 1
          done
          echo "--- /health ---"
          curl -sf http://localhost:8000/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          echo "--- /v1/agents ---"
          curl -sf http://localhost:8000/v1/agents | grep -q '"atlas"'
          echo "--- container runs as non-root ---"
          test "$(docker exec propilot id -u)" != "0"

      - name: Container logs
        if: always()
        run: docker logs propilot || true

      - name: Clean up
        if: always()
        run: docker rm -f propilot || true
