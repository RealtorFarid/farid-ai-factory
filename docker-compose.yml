# Local stack for Propilot AI.
#
#   cp backend/.env.example backend/.env   # then add your key
#   docker compose up --build
#
# Migrations run as a one-shot job before the API starts — never automatically
# inside the app, so a rolling deploy can never have two versions racing to
# alter the same schema.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: propilot
      POSTGRES_PASSWORD: propilot
      POSTGRES_DB: propilot
    ports:
      - "5432:5432"
    volumes:
      - propilot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propilot -d propilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: propilot-backend:local
    command: ["alembic", "upgrade", "head"]
    environment:
      PROPILOT_DATABASE_URL: postgresql+psycopg://propilot:propilot@postgres:5432/propilot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: propilot-backend:local
    ports:
      - "8000:8000"
    environment:
      PROPILOT_ENVIRONMENT: development
      PROPILOT_LOG_FORMAT: json
      PROPILOT_LOG_LEVEL: INFO
      PROPILOT_CORS_ORIGINS: http://localhost:5173
      PROPILOT_DATABASE_URL: postgresql+psycopg://propilot:propilot@postgres:5432/propilot
    env_file:
      # Optional so the stack still builds on a fresh clone.
      - path: ./backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  propilot-pgdata:
